name: CI

on:
  push:
    branches: [ main, rebuild ]
  pull_request:
    branches: [ main, rebuild ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify zero forbidden patterns
        run: npm run check:forbidden

      - name: Build Astro static site
        run: npm run build
