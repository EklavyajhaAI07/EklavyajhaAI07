<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dark background container */
    .bg { fill: #0B0D12; }
    
    /* Animated glowing perimeter border */
    .border-glow {
      stroke: url(#favBlueGrad);
      stroke-width: 1.5;
      fill: none;
      opacity: 0.8;
      stroke-dasharray: 50 150;
      animation: favOrbit 4s linear infinite;
    }
    
    /* Monogram Paths */
    .mark-stem {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    .path-e {
      stroke: #F4F5F7;
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
      animation: favPulseE 5s ease-in-out infinite;
    }
    
    .path-j {
      stroke: url(#favBlueGrad);
      stroke-dasharray: 80;
      stroke-dashoffset: 0;
      filter: drop-shadow(0 0 3px rgba(59, 130, 246, 0.9));
      animation: favPulseJ 5s ease-in-out infinite;
    }
    
    .pulse-node {
      fill: #60A5FA;
      animation: favBreathe 2.5s ease-in-out infinite alternate;
    }

    @keyframes favOrbit {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }
    
    @keyframes favPulseE {
      0%, 100% { stroke-dashoffset: 0; opacity: 1; }
      50% { stroke-dashoffset: 20; opacity: 0.85; }
    }
    
    @keyframes favPulseJ {
      0%, 100% { stroke-dashoffset: 0; filter: drop-shadow(0 0 4px rgba(59, 130, 246, 0.95)); }
      50% { stroke-dashoffset: -18; filter: drop-shadow(0 0 1.5px rgba(59, 130, 246, 0.5)); }
    }

    @keyframes favBreathe {
      0% { r: 2; opacity: 0.6; }
      100% { r: 3.2; opacity: 1; filter: drop-shadow(0 0 3px #60A5FA); }
    }

    @media (prefers-reduced-motion: reduce) {
      .border-glow, .path-e, .path-j, .pulse-node {
        animation: none !important;
      }
    }
  </style>

  <!-- Dark Rounded Plate -->
  <rect class="bg" x="2" y="2" width="60" height="60" rx="14" />
  
  <!-- Circuit Track / Glowing Border -->
  <rect class="border-glow" x="2" y="2" width="60" height="60" rx="14" />

  <!-- "E" Geometry -->
  <path class="mark-stem path-e" d="M 33 20 L 19 20 L 19 44 L 33 44 M 19 32 L 30 32" />

  <!-- "J" Geometry -->
  <path class="mark-stem path-j" d="M 45 20 L 45 38 C 45 44 40 46 33 46" />

  <!-- Energy Pulse Node on J Head -->
  <circle class="pulse-node" cx="45" cy="20" r="2.5" />
</svg>
